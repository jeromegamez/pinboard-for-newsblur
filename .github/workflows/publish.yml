# See https://github.com/actions/starter-workflows/blob/main/pages/static.yml
name: Publish

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */4 * * *' # every 4 hours, off the hour

permissions: {}

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      has_artifact: ${{ steps.rewrite.outputs.has_artifact }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.6"
          coverage: none
          tools: none
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Rewrite feeds
        id: rewrite
        run: |
          php run.php
          if [ -n "$(find .build -maxdepth 1 -type f 2>/dev/null)" ]; then
            echo "has_artifact=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No feeds generated; skipping GitHub Pages deployment."
            echo "has_artifact=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload artifact
        if: steps.rewrite.outputs.has_artifact == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: '.build'

  deploy:
    needs: build
    if: needs.build.outputs.has_artifact == 'true'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
